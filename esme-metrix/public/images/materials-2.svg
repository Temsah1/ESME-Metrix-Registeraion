<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="petroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#15304B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#petroBg)"/>

  <!-- Refinery / Rig stylized silhouette -->
  <g stroke="#38BDF8" stroke-width="2" fill="none" opacity="0.25">
    <line x1="100" y1="420" x2="700" y2="420"/>
    <line x1="200" y1="420" x2="200" y2="240"/>
    <line x1="240" y1="420" x2="240" y2="240"/>
    <line x1="200" y1="240" x2="240" y2="240"/>
    <line x1="200" y1="280" x2="240" y2="280"/>
    <line x1="200" y1="330" x2="240" y2="330"/>
    
    <!-- Rig Derrick Triangle -->
    <polygon points="400,160 330,420 470,420"/>
    <line x1="365" y1="290" x2="435" y2="290"/>
    <line x1="345" y1="360" x2="455" y2="360"/>
    <line x1="365" y1="290" x2="455" y2="360"/>
    <line x1="435" y1="290" x2="345" y2="360"/>

    <!-- Storage Tank -->
    <rect x="520" y="290" width="140" height="130" rx="15"/>
    <line x1="520" y1="330" x2="660" y2="330"/>
    <line x1="520" y1="370" x2="660" y2="370"/>
  </g>

  <!-- Flame at derrick peak -->
  <path d="M400,110 Q425,145 400,165 Q375,145 400,110 Z" fill="url(#fireGrad)"/>
  <circle cx="400" cy="150" r="8" fill="#FFFFFF"/>

  <!-- Molecular hydrocarbon chain in foreground -->
  <g stroke="#F59E0B" stroke-width="3" fill="#0F243A">
    <line x1="250" y1="230" x2="310" y2="200"/>
    <line x1="310" y1="200" x2="370" y2="230"/>
    <circle cx="250" cy="230" r="14" stroke="#F59E0B" fill="#D97706"/>
    <circle cx="310" cy="200" r="14" stroke="#F59E0B" fill="#F59E0B"/>
    <circle cx="370" cy="230" r="14" stroke="#F59E0B" fill="#D97706"/>
  </g>

  <text x="400" y="475" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="3">PETROLEUM &amp; ENERGY REFINING</text>
  <text x="400" y="510" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="16" fill="#F59E0B" letter-spacing="4">DRILLING, MINING &amp; PETROCHEMICALS</text>
  <text x="400" y="540" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#94A3B8">CAIRO UNIVERSITY FACULTY OF ENGINEERING</text>
</svg>
