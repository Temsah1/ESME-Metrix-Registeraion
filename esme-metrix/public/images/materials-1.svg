<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1929"/>
      <stop offset="50%" stop-color="#15304B"/>
      <stop offset="100%" stop-color="#0F243A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <circle cx="400" cy="300" r="280" fill="url(#glow)"/>
  
  <!-- Crystal Lattice / Unit Cell Hexagonal Grid -->
  <g stroke="#D97706" stroke-width="2" stroke-opacity="0.4" fill="none">
    <polygon points="400,140 500,200 500,320 400,380 300,320 300,200"/>
    <polygon points="400,220 460,255 460,325 400,360 340,325 340,255"/>
    <line x1="400" y1="140" x2="400" y2="220"/>
    <line x1="500" y1="200" x2="460" y2="255"/>
    <line x1="500" y1="320" x2="460" y2="325"/>
    <line x1="400" y1="380" x2="400" y2="360"/>
    <line x1="300" y1="320" x2="340" y2="325"/>
    <line x1="300" y1="200" x2="340" y2="255"/>
  </g>
  
  <!-- Glowing Atomic Spheres -->
  <circle cx="400" cy="140" r="14" fill="#F59E0B"/>
  <circle cx="500" cy="200" r="14" fill="#F59E0B"/>
  <circle cx="500" cy="320" r="14" fill="#F59E0B"/>
  <circle cx="400" cy="380" r="14" fill="#F59E0B"/>
  <circle cx="300" cy="320" r="14" fill="#F59E0B"/>
  <circle cx="300" cy="200" r="14" fill="#F59E0B"/>
  <circle cx="400" cy="290" r="20" fill="#10B981"/>

  <!-- Orbiting rings -->
  <ellipse cx="400" cy="290" rx="220" ry="80" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="8 6" fill="none" opacity="0.6" transform="rotate(-15 400 290)"/>
  <ellipse cx="400" cy="290" rx="220" ry="80" stroke="#10B981" stroke-width="1.5" stroke-dasharray="8 6" fill="none" opacity="0.6" transform="rotate(25 400 290)"/>

  <!-- Typography -->
  <text x="400" y="470" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="3">METALLURGY &amp; ADVANCED MATERIALS</text>
  <text x="400" y="505" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="16" fill="#F59E0B" letter-spacing="4">CRYSTAL LATTICE &amp; SUPERALLOYS</text>
  <text x="400" y="535" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#94A3B8">ESME METRIX 2026 • CAIRO UNIVERSITY</text>
</svg>
